<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selección de área de carrera</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #1f2937; padding: 20px; }
    .card { width: 100%; max-width: 440px; background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 12px 35px rgba(0,0,0,.10); }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 22px; color: #6b7280; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    select, input { width: 100%; padding: 13px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; background: #fff; }
    select:focus, input:focus { outline: 2px solid #2563eb; border-color: transparent; }
    button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; background: #111827; color: #fff; }
    button:hover { opacity: .92; }
    .note { margin-top: 15px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Selección de área de carrera</h1>
    <p>Elige un área e ingresa tu correo electrónico.</p>
    <form action="https://formsubmit.co/charlyaztec@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Nueva selección de área de carrera" />
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_captcha" value="false" />

      <label for="area">Área de carrera seleccionada</label>
      <select id="area" name="Área de carrera seleccionada" required>
        <option value="" selected disabled>Selecciona una opción</option>
        <option value="Área 1">Área 1</option>
        <option value="Área 2">Área 2</option>
        <option value="Área 3">Área 3</option>
        <option value="Área 4">Área 4</option>
      </select>

      <label for="correo">Correo electrónico</label>
      <input id="correo" name="Correo electrónico" type="email" required autocomplete="email" placeholder="nombre@correo.com" />

      <button type="submit">Enviar</button>
    </form>
    <div class="note">La selección será enviada por correo electrónico.</div>
  </main>
</body>
</html>
